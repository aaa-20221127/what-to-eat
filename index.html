<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香香公主的专属菜单</title>
<style>
  :root {
    --bg: #f7f0e3;
    --ink: #2b211a;
    --muted: #75675a;
    --card: #fffaf0;
    --line: #e2d5bf;
    --accent: #c8391f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; text-align: center; }
  .count { margin: 4px 0 14px; color: var(--muted); font-size: 14px; text-align: center; }
  .wheel-wrap { position: relative; width: 100%; max-width: 380px; margin: 0 auto; }
  canvas { display: block; width: 100%; aspect-ratio: 1; }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    width: 30px;
    height: 36px;
    transform: translateX(-50%);
    background: var(--ink);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .result {
    min-height: 92px;
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  .result .name { font-size: 28px; font-weight: 700; line-height: 1.3; }
  .result .sub { margin-top: 2px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .result .photo {
    display: block;
    width: 100%;
    max-width: 240px;
    aspect-ratio: 1;
    margin: 10px auto 0;
    border-radius: 10px;
    object-fit: cover;
  }
  .result .photo[hidden] { display: none; }
  .recipe {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    text-align: left;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  .recipe summary { cursor: pointer; font-weight: 700; }
  .recipe ol { margin: 8px 0; padding-left: 24px; }
  .recipe li + li { margin-top: 5px; }
  .recipe a { color: #245d75; font-size: 14px; }
  #spin {
    width: 100%;
    height: 54px;
    margin-top: 12px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
  }
  #spin:disabled { opacity: .55; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip:disabled { opacity: .55; }
  :focus-visible { outline: 3px solid #2b7a99; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>香香公主的专属菜单</h1>
  <p class="count" id="count"></p>

  <div class="wheel-wrap">
    <canvas id="wheel" role="img" aria-label="菜品转盘"></canvas>
    <div class="pointer" aria-hidden="true"></div>
  </div>

  <div class="result">
    <div aria-live="polite">
      <div class="name" id="name">转一下</div>
      <div class="sub" id="sub">转到什么，今天就做什么</div>
    </div>
    <img class="photo" id="dish-photo" alt="" decoding="async" hidden>
    <details class="recipe" id="recipe" hidden>
      <summary>制作步骤</summary>
      <ol id="recipe-steps"></ol>
      <a id="recipe-source" target="_blank" rel="noopener noreferrer">查看参考菜谱</a>
    </details>
  </div>

  <button id="spin" type="button">开始转</button>

  <div class="chips" id="chips"></div>
</main>

<script src="./recipe-steps.js"></script>
<script>
const COOKING_CATEGORIES = [
  { name: "清蒸", color: "#22708f", dishes: [
    "蒸蛋", "清蒸鲈鱼", "蒜蓉粉丝虾", "豉汁蒸排骨", "香菇蒸鸡", "肉饼蒸蛋", "蒜泥蒸茄子", "清蒸螃蟹", "清蒸生蚝蒜蓉",
  ] },
  { name: "炒", color: "#c8391f", dishes: [
    "香菜炒牛肉", "芹菜炒牛肉", "蒜苔炒肉", "蒜香大虾", "鸡蛋", "炒娃娃菜", "辣椒炒肉", "青椒肉丝",
    "西兰花炒虾仁", "手撕包菜", "番茄炒蛋", "黑椒牛柳", "鱼香肉丝", "醋溜娃娃菜", "宫保鸡丁", "酸辣土豆丝",
  ] },
  { name: "养生汤类", color: "#55721f", dishes: [
    "排骨萝卜汤", "排骨玉米汤", "番茄蛋花汤", "山药香菇鸡汤", "胡萝卜玉米鸡汤",
    "冬瓜薏米排骨汤", "丝瓜蛤蜊豆腐汤", "莲藕花生排骨汤", "萝卜羊肉汤",
  ] },
  { name: "炖煮与红烧", color: "#7f4527", dishes: [
    "番茄牛腩", "红烧肉", "萝卜炖牛腩", "咖喱鸡腿", "家常豆腐", "麻婆豆腐",
  ] },
  { name: "煎与收汁", color: "#a8620b", dishes: ["香煎鸡腿", "照烧鸡腿", "香煎鸡胸", "香煎鱼排", "煎牛排"] },
  { name: "卤味", color: "#743a74", dishes: ["卤牛腱"] },
  { name: "凉拌", color: "#47766d", dishes: ["拍黄瓜"] },
  { name: "焯拌", color: "#6a732e", dishes: ["蚝油生菜"] },
];

const SEAFOOD = new Set([
  "蒜香大虾", "西兰花炒虾仁", "清蒸鲈鱼", "蒜蓉粉丝虾", "清蒸螃蟹", "清蒸生蚝蒜蓉", "香煎鱼排", "丝瓜蛤蜊豆腐汤",
]);

const SEASONAL_SOUPS = [
  { name: "春季汤", color: "#47766d", dishes: ["山药香菇鸡汤", "胡萝卜玉米鸡汤"] },
  { name: "夏季汤", color: "#39747d", dishes: ["冬瓜薏米排骨汤", "丝瓜蛤蜊豆腐汤"] },
  { name: "冬季汤", color: "#88502e", dishes: ["莲藕花生排骨汤", "萝卜羊肉汤"] },
];

const KNOWN_DISHES = new Set([
  "香菜炒牛肉", "芹菜炒牛肉", "蒜苔炒肉", "蒜香大虾", "鸡蛋", "炒娃娃菜", "辣椒炒肉",
  "清蒸螃蟹", "清蒸生蚝蒜蓉", "排骨萝卜汤",
]);

const FILTERS = [
  { name: "全部", color: "#b9a88f" },
  { name: "已会", color: "#2f6b4f" },
  ...COOKING_CATEGORIES.slice(0, 3),
  { name: "海鲜", color: "#286499" },
  ...COOKING_CATEGORIES.slice(3),
  ...SEASONAL_SOUPS,
];

const ALL_DISHES = COOKING_CATEGORIES.flatMap(({name, color, dishes}) =>
  dishes.map(dish => {
    const categories = [name];
    if (SEAFOOD.has(dish)) categories.push("海鲜");
    if (KNOWN_DISHES.has(dish)) categories.push("已会");
    const season = SEASONAL_SOUPS.find(filter => filter.dishes.includes(dish));
    if (season) categories.push(season.name);
    return { name: dish, categories, color };
  })
);

const DISH_PHOTOS = new Map([
  ["香菜炒牛肉", "cilantro-beef"],
  ["芹菜炒牛肉", "celery-beef"],
  ["蒜苔炒肉", "garlic-scapes-pork"],
  ["蒜香大虾", "garlic-prawns"],
  ["鸡蛋", "eggs"],
  ["炒娃娃菜", "baby-napa"],
  ["辣椒炒肉", "chili-pork"],
  ["清蒸螃蟹", "steamed-crab"],
  ["清蒸生蚝蒜蓉", "garlic-oysters"],
  ["排骨萝卜汤", "pork-rib-daikon-soup"],
  ["青椒肉丝", "pepper-pork"],
  ["西兰花炒虾仁", "broccoli-shrimp"],
  ["手撕包菜", "torn-cabbage"],
  ["番茄炒蛋", "tomato-eggs"],
  ["黑椒牛柳", "black-pepper-beef"],
  ["蒸蛋", "egg-custard"],
  ["清蒸鲈鱼", "steamed-sea-bass"],
  ["蒜蓉粉丝虾", "vermicelli-shrimp"],
  ["豉汁蒸排骨", "black-bean-ribs"],
  ["香菇蒸鸡", "shiitake-chicken"],
  ["肉饼蒸蛋", "steamed-pork-patty-egg"],
  ["蒜泥蒸茄子", "steamed-garlic-eggplant"],
  ["番茄牛腩", "tomato-brisket"],
  ["红烧肉", "red-braised-pork"],
  ["萝卜炖牛腩", "daikon-brisket"],
  ["卤牛腱", "soy-braised-beef-shank"],
  ["排骨玉米汤", "pork-rib-corn-soup"],
  ["咖喱鸡腿", "curry-chicken-legs"],
  ["香煎鸡腿", "pan-fried-chicken-thigh"],
  ["照烧鸡腿", "teriyaki-chicken-thigh"],
  ["香煎鸡胸", "pan-fried-chicken-breast"],
  ["香煎鱼排", "pan-fried-fish"],
  ["煎牛排", "pan-seared-steak"],
  ["家常豆腐", "home-style-tofu"],
  ["鱼香肉丝", "yu-xiang-pork"],
  ["醋溜娃娃菜", "vinegar-napa"],
  ["宫保鸡丁", "kung-pao-chicken"],
  ["麻婆豆腐", "mapo-tofu"],
  ["蚝油生菜", "oyster-sauce-lettuce"],
  ["酸辣土豆丝", "hot-sour-potatoes"],
  ["拍黄瓜", "smashed-cucumber"],
  ["番茄蛋花汤", "tomato-egg-drop-soup"],
  ["山药香菇鸡汤", "yam-shiitake-chicken-soup"],
  ["胡萝卜玉米鸡汤", "carrot-corn-chicken-soup"],
  ["冬瓜薏米排骨汤", "winter-melon-job-tears-rib-soup"],
  ["丝瓜蛤蜊豆腐汤", "loofah-clam-tofu-soup"],
  ["莲藕花生排骨汤", "lotus-peanut-rib-soup"],
  ["萝卜羊肉汤", "daikon-lamb-soup"],
]);

const TAU = Math.PI * 2;
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const nameEl = document.getElementById("name");
const subEl = document.getElementById("sub");
const photoEl = document.getElementById("dish-photo");
const recipeEl = document.getElementById("recipe");
const stepsEl = document.getElementById("recipe-steps");
const sourceEl = document.getElementById("recipe-source");
const countEl = document.getElementById("count");
const spinBtn = document.getElementById("spin");
const chipsEl = document.getElementById("chips");

const state = { category: "全部", rot: 0, spinning: false, size: 0 };
let current = [];

function loadPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem("what-to-eat") || "{}");
    const renamed = new Map([
      ["快炒", "炒"], ["蒸", "清蒸"], ["压力炖", "炖煮与红烧"], ["煎和收汁", "煎与收汁"],
    ]);
    const category = renamed.get(saved.category) || saved.category;
    if (FILTERS.some(filter => filter.name === category)) state.category = category;
  } catch (e) {}
}

function savePrefs() {
  try {
    localStorage.setItem("what-to-eat", JSON.stringify({ category: state.category }));
  } catch (e) {}
}

function filterDishes() {
  current = ALL_DISHES.filter(d => state.category === "全部" || d.categories.includes(state.category));
  countEl.textContent = "当前 " + current.length + " 道菜";
}

function draw() {
  const size = state.size;
  if (!size) return;
  const c = size / 2, r = c - 4, n = current.length, step = TAU / n;
  ctx.setTransform(canvas.width / size, 0, 0, canvas.height / size, 0, 0);
  ctx.clearRect(0, 0, size, size);

  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + state.rot + i * step;
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, r, a, a + step);
    ctx.closePath();
    ctx.fillStyle = current[i].color;
    ctx.fill();
    if (i % 2) { ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fill(); }
    ctx.strokeStyle = "rgba(255,250,240,.75)";
    ctx.lineWidth = 1;
    ctx.stroke();

    const textEnd = r - 10;
    const textMax = textEnd - r * 0.24;
    const longest = Math.max(...current.map(d => d.name.length));
    let font = Math.min(20, textEnd * step / (1.15 + longest * step));
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(a + step / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.font = "600 " + font + "px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
    const w = ctx.measureText(current[i].name).width;
    if (w > textMax) {
      font = Math.max(9, font * textMax / w);
      ctx.font = "600 " + font + "px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
    }
    ctx.fillText(current[i].name, textEnd, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(c, c, r, 0, TAU);
  ctx.strokeStyle = "#2b211a";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(c, c, r * 0.17, 0, TAU);
  ctx.fillStyle = "#fffaf0";
  ctx.fill();
  ctx.strokeStyle = "#2b211a";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function resize() {
  const size = canvas.getBoundingClientRect().width;
  if (!size) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  state.size = size;
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  draw();
}

function setBusy(busy) {
  state.spinning = busy;
  spinBtn.disabled = busy;
  chipsEl.querySelectorAll("button").forEach(b => { b.disabled = busy; });
  spinBtn.textContent = busy ? "转动中" : "再转一次";
}

function showResult(dish) {
  nameEl.textContent = dish.name;
  subEl.textContent = dish.categories.join(" · ");
  const photo = DISH_PHOTOS.get(dish.name);
  if (photo) photoEl.src = "./photos/" + photo + ".webp";
  const steps = RECIPE_STEPS[photo];
  if (steps) {
    stepsEl.replaceChildren(...steps.map(step => {
      const item = document.createElement("li");
      item.textContent = step;
      return item;
    }));
    sourceEl.href = RECIPE_SOURCES[photo];
    recipeEl.hidden = false;
  }
}

function hidePhoto() {
  photoEl.hidden = true;
  photoEl.removeAttribute("src");
}

function hideDishDetails() {
  hidePhoto();
  recipeEl.hidden = true;
  recipeEl.open = false;
}

function resetResult() {
  hideDishDetails();
  nameEl.textContent = "转一下";
  subEl.textContent = "转到什么，今天就做什么";
  spinBtn.textContent = "开始转";
}

function spin() {
  if (state.spinning || !current.length) return;
  const n = current.length, step = TAU / n;
  const pick = Math.floor(Math.random() * n);
  const offset = (0.5 + (Math.random() - 0.5) * 0.7) * step;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const turns = reduced ? 0 : 5 + Math.floor(Math.random() * 3);
  const delta = (((-pick * step - offset - state.rot) % TAU) + TAU) % TAU;
  const start = state.rot;
  const distance = turns * TAU + delta;
  const duration = reduced ? 1 : 4200;
  const t0 = performance.now();

  setBusy(true);
  hideDishDetails();
  nameEl.textContent = "……";
  subEl.textContent = "看看今天吃什么";

  function frame(now) {
    const p = Math.min(1, (now - t0) / duration);
    state.rot = start + distance * (1 - Math.pow(1 - p, 4));
    draw();
    if (p < 1) { requestAnimationFrame(frame); return; }
    state.rot = ((state.rot % TAU) + TAU) % TAU;
    setBusy(false);
    showResult(current[pick]);
  }
  requestAnimationFrame(frame);
}

function renderChips() {
  chipsEl.innerHTML = "";
  FILTERS.forEach(cat => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("aria-pressed", String(state.category === cat.name));
    b.style.setProperty("--c", cat.color);
    const dot = document.createElement("i");
    b.append(dot, cat.name);
    b.addEventListener("click", () => {
      state.category = cat.name;
      applyFilter();
      renderChips();
    });
    chipsEl.appendChild(b);
  });
}

function applyFilter() {
  filterDishes();
  savePrefs();
  resetResult();
  draw();
}

loadPrefs();
photoEl.addEventListener("load", () => {
  photoEl.hidden = !photoEl.hasAttribute("src") || !photoEl.naturalWidth;
});
photoEl.addEventListener("error", hidePhoto);
spinBtn.addEventListener("click", spin);
filterDishes();
renderChips();
resize();
if ("ResizeObserver" in window) new ResizeObserver(resize).observe(canvas);
else window.addEventListener("resize", resize);
</script>
</body>
</html>
